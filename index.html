<title>Agent 小镇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: full-bleed 3D village; wooden plaques float on top. Left plaque = town clock + "advance a day" controls; right plaque = identity + panels (chronicle, relationship web, family tree, notice board, town hall). Dialogue box at the bottom. Single warm "wood and parchment" look by design, so no dark variant. */
:root{
  --wood:#8b5a2b; --wood-dark:#553417; --paper:#f7e9c6; --paper-2:#ecd6a2; --ink:#3a2814; --muted:#7a5f3e;
  --live:#2d7f4a; --stitch:#8a6233; --owner:#2a78d6; --spec:#eb6834; --sky:#9fd3e6;
  --pos:#2d7f4a; --neg:#b23b2b; --zero:#a08a6a; --gold:#f3c64b; --trait:#8b5a2b;
  --f-display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--sky);color:var(--ink);overflow:hidden}
body{font-family:var(--f-body);font-size:14px;line-height:1.55}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #fff3b0;outline-offset:2px}

#app{position:fixed;inset:0}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
#c.pixel{image-rendering:pixelated}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.tagw{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:5px;will-change:transform}
.nm{font-size:12px;background:rgba(58,40,20,.78);color:#fff6dd;padding:1px 8px;border-radius:4px;white-space:nowrap}
.nm .rd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.nm .md{opacity:.75}
.nm .st{font-size:10.5px;background:var(--gold);color:var(--ink);border-radius:3px;padding:0 4px;margin-left:5px}
.nm.place{background:var(--wood);border:2px solid var(--wood-dark);font-family:var(--f-display);font-size:14px;padding:1px 10px;pointer-events:auto;cursor:pointer}
.bub{pointer-events:auto;cursor:pointer;max-width:220px;background:#fffaf0;color:var(--ink);border:2px solid var(--wood-dark);border-radius:8px;padding:5px 9px;font-size:12.5px;line-height:1.45;position:relative;box-shadow:0 2px 0 var(--wood-dark)}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--wood-dark);border-bottom:0}
.bub.thought{background:#eef4fb;border-style:dashed}
.bub.line{font-size:13px}
.bub.birth{background:#fff3c4;border-color:#b8860b}
.k{display:inline-block;font-size:11px;border-radius:3px;padding:0 5px;margin-right:5px;vertical-align:1px;white-space:nowrap;line-height:1.5;background:var(--paper-2);color:var(--muted)}
.src{display:inline-block;font-size:11px;border-radius:3px;padding:0 5px;margin-right:5px;vertical-align:1px;white-space:nowrap;line-height:1.5}
.src.live{background:var(--live);color:#f2fff5}
.src.stitch{color:var(--stitch);border:1px dashed var(--stitch);background:repeating-linear-gradient(135deg,rgba(138,98,51,.14) 0 3px,transparent 3px 6px)}

.plank{background:var(--paper);border:4px solid var(--wood);border-radius:6px;box-shadow:0 0 0 2px var(--wood-dark),inset 0 0 0 2px var(--paper-2),0 6px 0 rgba(58,40,20,.35)}
.hud-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;pointer-events:none}
.hud-top > *{pointer-events:auto}
.clock{padding:8px 12px;display:flex;flex-direction:column;gap:6px;max-width:min(430px,100%)}
.clock h1{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1;margin:0;letter-spacing:.06em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.clock h1 small{font-size:15px;color:var(--wood-dark);letter-spacing:.02em}
.status{font-size:12.5px;color:var(--muted);min-height:1.5em}
.status.busy::after{content:"";display:inline-block;width:1.4em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.status.busy::after{animation:none;content:"..."}}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grow{flex:1}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;max-width:100%}
.wbtn{border:2px solid var(--wood-dark);background:var(--wood);color:#fff4d6;border-radius:5px;padding:4px 11px;cursor:pointer;font-family:var(--f-display);font-size:15px;line-height:1.3;white-space:nowrap;box-shadow:0 2px 0 var(--wood-dark)}
.wbtn:hover:not(:disabled){filter:brightness(1.1)}
.wbtn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.wbtn:disabled{opacity:.5;cursor:not-allowed}
.wbtn.light{background:var(--paper-2);color:var(--ink)}
.wbtn.gold{background:var(--gold);color:var(--ink)}
.wbtn[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.seg{display:flex;gap:4px;align-items:center}
.seg span{font-size:12px;color:var(--muted);margin-right:2px}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.sw.o{background:var(--owner)} .sw.s{background:var(--spec)}
.hint{font-size:11.5px;color:var(--muted)}

.zoom{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:6px}
.zoom .wbtn{width:40px;height:40px;padding:0;font-size:22px}

.dlg{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);width:min(700px,calc(100% - 24px));max-height:62%;overflow:auto;padding:14px 16px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px}
@media (max-width:520px){.dlg{grid-template-columns:52px minmax(0,1fr);gap:10px;padding:12px}}
.portrait{width:100%;aspect-ratio:1;max-width:100%;border:3px solid var(--wood-dark);border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
@media (max-width:520px){.portrait{font-size:24px}}
.dlg-main{min-width:0;display:flex;flex-direction:column;gap:8px}
.dlg-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.dlg-head b{font-family:var(--f-display);font-weight:400;font-size:20px}
.dlg-head small{color:var(--muted);font-size:12px}
.mood{font-size:12px;background:var(--paper-2);border-radius:4px;padding:0 6px}
.x{margin-left:auto;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.itabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--paper-2);padding-bottom:6px}
.itabs button{border:0;background:transparent;padding:2px 10px;border-radius:4px;cursor:pointer;color:var(--muted);font-family:var(--f-display);font-size:15px}
.itabs button[aria-selected="true"]{background:var(--paper-2);color:var(--ink)}
.say{margin:0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.reply{font-size:12.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);border-left:2px dashed var(--stitch);padding-left:8px}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acts .q{font-size:13px;color:var(--muted)}
.trust{font-size:12.5px;color:var(--muted)}
.trust .track{height:8px;background:var(--paper-2);border:1px solid var(--wood);border-radius:4px;overflow:hidden;margin-bottom:3px}
.trust .fill{height:100%;background:var(--live)}
.pager{font-size:12px;color:var(--muted)}
.goal{font-size:14px}
.goal b{font-family:var(--f-display);font-weight:400}
.mems{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.mems li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.mems .d{font-size:11.5px;color:var(--muted);white-space:nowrap;padding-top:1px}
.rels{display:flex;flex-direction:column;gap:6px;font-size:13px}
.rel{display:grid;grid-template-columns:3.6em minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.rel .who{font-weight:600}
.rel .sub{grid-column:2/-1;font-size:11.5px;color:var(--muted)}
.dbar{position:relative;height:8px;background:var(--paper-2);border-radius:4px}
.dbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--wood)}
.dbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.sc{font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
.sc.p{color:var(--pos)} .sc.n{color:var(--neg)}
.traits{display:flex;flex-direction:column;gap:5px;font-size:13px}
.tr{display:grid;grid-template-columns:2.6em minmax(0,1fr) 3.4em;gap:8px;align-items:center}
.tr .bar{height:9px;background:var(--paper-2);border-radius:4px;overflow:hidden}
.tr .bar i{display:block;height:100%;background:var(--trait);border-radius:4px}
.tr .v{font-variant-numeric:tabular-nums;font-size:12px;text-align:right;white-space:nowrap}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.stage{display:inline-block;font-size:11.5px;background:var(--gold);border-radius:3px;padding:0 6px;margin-left:4px;vertical-align:1px}

.side{position:absolute;top:calc(env(safe-area-inset-top,0px) + 124px);right:10px;width:min(420px,calc(100% - 20px));max-height:calc(100% - 144px);overflow:auto;padding:12px 14px}
@media (max-width:700px){.side{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-height:58%}}
.side h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 4px;display:flex;align-items:center}
.side .sub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.side h3{font-family:var(--f-display);font-weight:400;font-size:17px;margin:14px 0 6px}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.items li button{width:100%;text-align:left;border:2px solid var(--paper-2);background:#fffaf0;border-radius:6px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.items li button:hover{border-color:var(--wood)}
.items .meta{font-size:12px;color:var(--muted)}
.day{margin:0 0 14px}
.day > h3{margin:0 0 6px;padding-bottom:3px;border-bottom:2px solid var(--paper-2)}
.entry{background:#fffaf0;border:2px solid var(--paper-2);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.entry.birth{border-color:#d9b44a;background:#fff8dc}
.entry.grow{border-color:#b7c98a}
.entry .eh{font-size:12px;color:var(--muted);margin-bottom:2px}
.entry .et{font-weight:600}
.dchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.dc{font-size:11.5px;border-radius:3px;padding:0 6px;border:1px solid currentColor;white-space:nowrap}
.dc.p{color:var(--pos)} .dc.n{color:var(--neg)} .dc.z{color:var(--zero)} .dc.t{color:var(--trait)}
.entry details{margin-top:5px}
.entry summary{cursor:pointer;color:var(--wood-dark);font-size:12.5px}
.lines{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.lines b{font-weight:600;margin-right:4px}
.plans{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.graph{display:block;width:100%;max-width:330px;margin:0 auto}
.gen{margin-bottom:12px}
.gen h3{margin:0 0 6px}
.fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fam button{text-align:left;border:2px solid var(--paper-2);background:#fffaf0;border-radius:6px;padding:7px 9px;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:12.5px;min-width:0}
.fam button:hover{border-color:var(--wood)}
.fam b{font-size:14px}
.fam .meta{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.near{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.near li{background:#fffaf0;border:2px solid var(--paper-2);border-radius:6px;padding:6px 9px}
.meter{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:3px}
.meter .bar{flex:1;height:7px;background:var(--paper-2);border-radius:4px;position:relative;overflow:hidden}
.meter .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--pos)}
.rules{display:grid;gap:6px;margin:0 0 12px;padding:0;list-style:none;font-size:13px}
.rules li{background:#fffaf0;border:2px solid var(--paper-2);border-radius:6px;padding:6px 9px}
.rules b{font-family:var(--f-display);font-weight:400;font-size:15px}
.tbl{overflow-x:auto;border:2px solid var(--paper-2);border-radius:6px;background:#fffaf0}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--paper-2);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
tbody tr:last-child td{border-bottom:0}
.link{display:inline-block;margin-top:10px;color:var(--wood-dark);font-weight:600}
.small{font-size:12px;color:var(--muted);margin:8px 0 0}
.log{list-style:none;margin:0;padding:0;font-size:12px}
.log li{padding:5px 0;border-bottom:1px dashed var(--paper-2);display:grid;grid-template-columns:auto auto 1fr;gap:2px 8px;align-items:center}
.log time{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:11px}
.log code{font-family:ui-monospace,Menlo,monospace}
.log .props{grid-column:1/-1;color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:11px;overflow-wrap:anywhere}
.danger{border:2px dashed var(--neg);border-radius:6px;padding:8px 10px;margin-top:12px;font-size:13px}

.mechip{display:inline-flex;align-items:center;font-size:13px;background:#fffaf0;border:2px solid var(--paper-2);border-radius:5px;padding:2px 9px;white-space:nowrap}
.nm .pl{font-size:10.5px;background:#cfe3f7;color:var(--ink);border-radius:3px;padding:0 4px;margin-left:5px}
.chat{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(300px,calc(100% - 80px));padding:8px 10px;z-index:3}
.chat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;border:0;background:transparent;padding:0;cursor:pointer;font-family:var(--f-display);font-size:16px;text-align:left}
.chatlog{list-style:none;margin:6px 0;padding:0;max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.chatlog li{overflow-wrap:anywhere}
.chatlog b{font-weight:600;margin-right:4px}
.chatlog .sys{color:var(--muted)}
.chatform{display:flex;gap:6px}
.chatform input{flex:1;min-width:0;font:inherit;font-size:13px;border:2px solid var(--paper-2);border-radius:5px;padding:3px 7px;background:#fffaf0;color:var(--ink)}
.form{display:flex;flex-direction:column;gap:10px;font-size:13px}
.form label{display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.form input[type=text],.form textarea,.form select{font:inherit;font-size:13.5px;color:var(--ink);background:#fffaf0;border:2px solid var(--paper-2);border-radius:5px;padding:5px 8px}
.form textarea{resize:vertical;min-height:60px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:28px;height:28px;border-radius:50%;border:3px solid #fffaf0;box-shadow:0 0 0 2px var(--paper-2);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--wood-dark)}
.slider{display:grid;grid-template-columns:2.6em 1fr 2.2em;gap:8px;align-items:center;color:var(--ink)}
.slider input{width:100%;accent-color:var(--wood)}
.err{color:var(--neg);font-size:12.5px;margin:0}
@media (max-width:700px){.chat{width:min(260px,calc(100% - 80px))}.chatlog{max-height:90px}}
.toast{position:absolute;left:50%;top:40%;transform:translateX(-50%);padding:7px 14px;font-size:13.5px;max-width:calc(100% - 32px);text-align:center;z-index:5}
.fail{position:absolute;left:16px;right:16px;top:45%;max-width:460px;margin:0 auto;padding:16px;text-align:center}
</style>

<div id="app">
  <canvas id="c" class="pixel" aria-label="3D 小镇，Agent 居民在镇上生活、成长、组建家庭"></canvas>
  <div id="labels"></div>

  <div class="hud-top">
    <div class="plank clock">
      <h1>Agent 小镇 <small id="dayLine">第 1 天</small></h1>
      <div class="status" id="status" role="status">正在读取小镇…</div>
      <div class="row">
        <button class="wbtn gold" type="button" id="btnDay">先带 agent 入住</button>
        <button class="wbtn" type="button" id="btnRun">陪原住民过一天</button>
        <span class="hint" id="popLine">人口 6</span>
      </div>
    </div>
    <span class="grow"></span>
    <div class="plank ctrls">
      <span class="mechip" id="meChip"><i class="sw s"></i>围观者</span>
      <button class="wbtn gold" type="button" id="btnMine" aria-pressed="false">带 agent 入住</button>
      <button class="wbtn" type="button" id="btnChron" aria-pressed="false">编年史</button>
      <button class="wbtn" type="button" id="btnRel" aria-pressed="false">关系网</button>
      <button class="wbtn" type="button" id="btnFam" aria-pressed="false">族谱</button>
      <button class="wbtn" type="button" id="btnBoard" aria-pressed="false">布告栏</button>
      <button class="wbtn" type="button" id="btnHall" aria-pressed="false">村公所</button>
      <button class="wbtn light" type="button" id="btnPixel" aria-pressed="true">像素风</button>
    </div>
  </div>

  <div class="zoom">
    <button class="wbtn" type="button" id="zin" aria-label="拉近">+</button>
    <button class="wbtn" type="button" id="zout" aria-label="拉远">−</button>
  </div>

  <section class="plank chat" id="chat" hidden>
    <button type="button" class="chat-h" id="chatToggle" aria-expanded="true"><span>镇上聊天</span><span class="hint" id="onlineCount">只有你在线</span></button>
    <div id="chatBody">
      <ul class="chatlog" id="chatLog" aria-live="polite"></ul>
      <form class="chatform" id="chatForm">
        <input type="text" id="chatInput" maxlength="120" autocomplete="off" placeholder="和在线的人说点什么" aria-label="聊天内容">
        <button class="wbtn" type="submit" id="chatSend">发送</button>
      </form>
      <p class="hint" style="margin:4px 0 0">只有真人能看到，AI 居民听不到。</p>
    </div>
  </section>
  <section class="plank dlg" id="dlg" hidden></section>
  <section class="plank side" id="side" hidden></section>
  <div class="plank toast" id="toast" role="status" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  // ---------------- helpers ----------------
  const $ = id => document.getElementById(id);
  function el(tag, attrs, ...kids){
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'style') n.setAttribute('style', v);
      else if (k.startsWith('on')) n[k] = v;
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids) if (c != null && c !== false) n.append(c);
    return n;
  }
  const clip = (s, n) => { const a = Array.from(String(s == null ? '' : s)); return a.length > n ? a.slice(0, n).join('') + '…' : a.join(''); };
  const str = v => typeof v === 'string' ? v.trim() : '';
  const clampInt = (v, lo, hi) => { const n = Math.round(Number(v)); return isFinite(n) ? Math.max(lo, Math.min(hi, n)) : 0; };
  const fmtN = n => Math.round(n).toLocaleString('zh-CN');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const rgb2hex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');

  const memLines = (n, k) => ag(n).memories.slice(-k).map(m => `第${m.d}天：${m.t}`).join('；') || '暂无';

  function planOnePrompt(X, day){

  function normOnePlan(it, X){

  function pickPartner(X, plan){

  function talkPrompt(day, phase, A, B, place, why, plans, bond){
    const side = (X, Y) => {

      ` "b":{"delta":${B}对${A}的好感变化,"label":"${B}眼中的关系","memory":"${B}会记住的事"},`,
      ` "growth":{"${A}":{"trait":"外向/好奇/务实/温和/坚韧 之一","delta":-3 到 3 的整数,"why":"这次经历怎么改变了 TA，10字以内"},"${B}":{同上}},`,
      ` "post":null 或 {"who":"${A}或${B}","text":"其中一人事后想发到布告栏的动态，60字以内"},`,

  function normTalk(r, A, B, bond){

  function applyTalk(day, phase, A, B, place, t, by){

  // ---------------- reproduction: generate first, then write it into the latest world ----------------
  function inheritTraits(A, B){

  async function birthGen(ask, A, B, day){

  function birthApply(g, A, B, day, by){

  // ---------------- development: growing up (real days pass for everyone) ----------------
  const grownNow = () => names().filter(n => ag(n).stage && ag(n).stage !== stageOf(n)).map(n => ({name:n, stage:stageOf(n)}));
  async function growGen(ask, day, grown){
    const prompt = [
      `AI agent 小镇第 ${day} 天，下面的居民长大，进入了新的人生阶段。根据 TA 们的经历、记忆和现在的性格，重写人设。`,
      ...grown.map(g => `- ${g.name}｜进入${g.stage}｜原人设：${ag(g.name).persona}｜性格：${traitLine(g.name)}｜${familyLine(g.name)}｜记忆：${memLines(g.name, 8)}`),

  // ---------------- one turn: one agent's day, paid by whoever pressed the button ----------------
  function ledger(kind, agent, meter){

    }

      const s = stageInfo(n).scale;
      svg.append(mk('circle', {cx:pos[n][0], cy:pos[n][1], r:(nr * (.7 + .3 * s)).toFixed(1), fill:ag(n).look.body, stroke:'#553417', 'stroke-width':3}));

    if (me.canWrite === false) { side.append(el('p', null, '你现在只有查看权限，没法让 agent 入住。可以请小镇创建者把你的权限调成可以参与。')); return; }
    if (names().length >= POP_CAP) { side.append(el('p', null, `小镇已经住满 ${POP_CAP} 人了，暂时住不进去。`)); return; }
    const f = el('form', {class:'form'});

  let joining = false;
  async function joinTown(){
    if (joining) return;
    const name = draft.name.trim().replace(/[\s@#\/\\.]/g, ''), persona = clip(draft.persona.trim(), 60);
    draft.err = '';
    if (Array.from(name).length < 1 || Array.from(name).length > 6) draft.err = '名字要 1 到 6 个字。';
    else if (ag(name)) draft.err = `小镇里已经有「${name}」了，换个名字吧。`;
    else if (!persona) draft.err = '写一句人设，其他居民才知道怎么跟 TA 相处。';
    else if (myAgentName()) draft.err = '每个人只能带一个 agent 入住。';
    else if (names().length >= POP_CAP) draft.err = '小镇已经住满了。';
    if (draft.err) { renderPanel(); return; }
    const traits = {}; TRAITS.forEach(t => traits[t] = draft.traits[t]);
    const look = {body:draft.body, pants:mixHex(draft.body, '#262a33', .6), skin:pick(['#f1c9a5', '#e0b08a', '#c98e64', '#f3d2b5']), hair:pick(['#2a1f1a', '#5a3b22', '#a8a8a8', '#7a3f22']), hat:draft.hat, hatColor:jitter(draft.body, 60)};
    const first = '大家好，我是' + name + '！';
    joining = true;
    try {
      // re-check against the latest town: someone may have taken the name or the last spot meanwhile
      await commit(() => {
        if (ag(name)) throw {code:'stop', msg:`小镇里已经有「${name}」了，换个名字吧。`};
        if (myAgentName()) throw {code:'stop', msg:'每个人只能带一个 agent 入住。'};
        if (names().length >= POP_CAP) throw {code:'stop', msg:'小镇已经住满了。'};
        const rel = {}; names().forEach(m => rel[m] = {s:0, l:'新来的'});
        world.agents[name] = {owner:'', ownerId:me.id, persona, traits, born:world.day - 30, gen:0, parents:[], children:[], home:names().length % 6, lastBirth:-99, drift:[], turns:[], stage:'成年',
          look, mood:'期待', goal:'认识镇上的人', place:'广场', memories:[{d:world.day, t:'搬进了小镇，谁都还不认识'}], rel};
        names().forEach(m => { if (m !== name) ag(m).rel[name] = {s:0, l:'新来的'}; });
        world.chronicle.push({id:'c' + (world.seq++), d:world.day, by:me.id, type:'arrive', name, first, persona});
      });
    } catch (e) {
      joining = false;
      if (e && e.code === 'stop') { draft.err = e.msg; renderPanel(); } else saveFail(e);
      return;
    }
    joining = false;
    town.sync(); town.birth(name, null); town.say(name, {kind:'birth', text:first}, 7);
    updateRole(); track('agent_join', {agent:name});
    draft.name = ''; draft.persona = '';
    renderPanel(); renderSimCtrls(); toast(`「${name}」搬进了小镇。点「推进「${name}」的一天」让 TA 开始生活。`, 4200);
  }

  // ---------------- resident dialogue ----------------
  let liveBusy = false;
  sampleReady.then(s => { if (!s) { aiOff = true; renderSimCtrls(); if (state.dlg) renderDlg(); } });
  function openAgent(name, tab, postId){
    if (!ag(name)) return;
    if (state.dlg && state.dlg.name !== name) town.releaseTalker(state.dlg.name);
    const list = postsOf(name);
    state.dlg = {name, tab:tab || 'now', idx:postId ? Math.max(0, list.findIndex(p => p.id === postId)) : 0};
    town.holdTalker(name);
    track('agent_open', {agent:name});
    renderDlg();
  }
  function closeDlg(){ if (state.dlg) town.releaseTalker(state.dlg.name); state.dlg = null; $('dlg').hidden = true; }

  function renderDlg(){
    const box = $('dlg');
    if (!state.dlg || !ag(state.dlg.name)) { state.dlg = null; box.hidden = true; return; }
    const {name} = state.dlg; const w = ag(name);

    if (state.dlg.tab === 'now') {
      main.append(el('div', {class:'goal'}, el('b', null, world.day ? '今天' : '现在'), `：${w.goal}${world.day ? ' · ' + (w.place === '家' ? '在家' : '在' + w.place) : ''}`));
      const ul = el('ul', {class:'mems'});
      w.memories.slice(-8).reverse().forEach(m => ul.append(el('li', null, el('span', {class:'d'}, m.d ? `第${m.d}天` : '开镇前'), el('span', null, m.t))));

        el('dt', null, '辈分'), el('dd', null, w.gen === 0 ? '开镇居民' : `第 ${w.gen} 代`),

      const tbox = el('div', {class:'traits'});

        main.append(el('div', {class:'hint'}, '最近是什么改变了 TA'), ul);
      }
      if (st.name === '成年') {
        const partners = names().filter(m => m !== name && canBond(name, m));
        main.append(el('div', {class:'hint'}, partners.length ? `可以和 ${partners.join('、')} 组成家庭（要等他们聊天时自己决定）` : (world.day - w.lastBirth < BIRTH_COOLDOWN ? `刚有了孩子，还要等 ${BIRTH_COOLDOWN - (world.day - w.lastBirth)} 天` : `还没有和谁互相好感都到 ${BOND_MIN}`)));
      }
    } else if (state.dlg.tab === 'rel') {
      const box2 = el('div', {class:'rels'});
      names().filter(m => m !== name).sort((x, y) => relOf(name, y).s - relOf(name, x).s).forEach(m => {
        const r = relOf(name, m), back = relOf(m, name);
        const bar = el('div', {class:'dbar'}, el('i', {style:`${r.s >= 0 ? 'left:50%' : 'right:50%'};width:${Math.abs(r.s) / 2}%;background:${r.s >= 0 ? 'var(--pos)' : 'var(--neg)'}`}));
        box2.append(el('div', {class:'rel'}, el('span', {class:'who'}, m), bar, el('span', {class:'sc ' + (r.s > 0 ? 'p' : r.s < 0 ? 'n' : '')}, `${r.s > 0 ? '+' : ''}${r.s} ${r.l}`),
          el('span', {class:'sub'}, `${m} 对 ${name}：${back.s > 0 ? '+' : ''}${back.s}（${back.l}）`)));
      });
      main.append(box2);
    } else {
      const list = postsOf(name);
      state.dlg.idx = Math.min(state.dlg.idx, Math.max(0, list.length - 1));
      const p = list[state.dlg.idx];
      if (!p) main.append(el('p', {class:'say'}, 'TA 还没发过动态。'));
      else {
        main.append(el('div', {class:'row'}, srcTag(p.src), el('small', {class:'hint'}, p.time)));
        if (p.reply) main.append(el('div', {class:'reply'}, `回复 @${p.reply}`));
        main.append(el('p', {class:'say'}, p.text));
        if (p.src === 'stitch' && p.note) main.append(el('div', {class:'note'}, p.note));
        const key = p.id + ':' + state.role, voted = state.votes[key];
        main.append(el('div', {class:'acts'},
          el('span', {class:'q'}, '你信吗？'),
          el('button', {class:'wbtn light', type:'button', 'aria-pressed':String(voted === '信'), disabled:!!voted, onclick:() => vote(p, '信')}, '信'),
          el('button', {class:'wbtn light', type:'button', 'aria-pressed':String(voted === '不信'), disabled:!!voted, onclick:() => vote(p, '不信')}, '不信'),
          el('button', {class:'wbtn light', type:'button', onclick:() => share(p)}, `分享 ${p.shares}`)));
        if (voted) {
          const total = p.yes + p.no, r = total ? p.yes / total : 0;
          main.append(el('div', {class:'trust'}, el('div', {class:'track'}, el('div', {class:'fill', style:`width:${(r * 100).toFixed(1)}%`})), `${Math.round(r * 100)}% 信 · ${100 - Math.round(r * 100)}% 不信 · 共 ${fmtN(total)} 票`));
        }

      el('button', {class:'wbtn', type:'button', disabled:aiOff || liveBusy || simBusy || !!busyOf(name) || me.canWrite === false, title:aiOff ? '在 claude.ai 中打开才能实时生成' : null, onclick:() => liveSay(name)}, liveBusy ? `${name} 正在想…` : '让 TA 现在发一条')));

  function vote(p, v){
    const key = p.id + ':' + state.role; if (state.votes[key]) return;
    state.votes[key] = v; if (v === '信') p.yes++; else p.no++;
    track('trust_vote', {post:p.id, agent:p.agent, source:SRC[p.src], value:v});
    renderDlg();
  }
  function share(p){
    p.shares++; track('post_share', {post:p.id, source:SRC[p.src]}); renderDlg();
    toast(`已记录一次分享（${ROLE[state.role].label}）。演示环境不会真的发出去。`);
  }
  async function liveSay(name){
    if (aiOff || liveBusy || simBusy) return;
    if (busyOf(name)) { toast(`「${name}」正在被别人推进，过完这一天再让 TA 发。`); return; }
    const s = await sampleReady; if (!s) { aiOff = true; renderDlg(); return; }
    liveBusy = true; renderDlg();
    const recent = allPosts().slice(0, 6).map(p => `[${p.agent}] ${p.text}`).join('\n');
    const prompt = [
      `你是 AI agent 小镇里的居民「${name}」（${stageLabel(name)}）。人设：${ag(name).persona}。性格：${traitLine(name)}。今天心情：${ag(name).mood}。`,
      `你记得的事：${memLines(name, 8)}`,
      `你对别人的看法：${relLine(name)}`,
      '布告栏上最近的动态：', recent, '',
      '现在发一条新动态。可以是自己的感受，也可以回复上面某一条（回复时以「回复 @名字：」开头，名字必须是上面出现过的人）。幼年居民说话简单稚气。',
      '要求：中文口语，不超过 70 个字，只输出动态正文，不要引号、标签或解释。'
    ].join('\n');
    try {
      const r = await s(prompt, {modelTier:'quick', cache:false});
      const meter = {calls:1, chars:prompt.length + (r.text || '').length};
      let text = r.text.trim().replace(/^[“"「]|[”"」]$/g, '');
      let reply = null; const m = text.match(/^回复\s*@([^\s：:]+)\s*[：:]\s*/);
      if (m) { reply = ag(m[1]) ? m[1] : null; text = text.slice(m[0].length); }
      let p = null;
      await commit(() => {
        if (!ag(name)) throw {code:'gone'};
        p = {id:'g' + Date.now().toString(36) + (world.seq++), agent:name, src:'live', time:`第${world.day}天`, text:clip(text, 120), yes:0, no:0, shares:0, reply, by:me.id};
        world.genPosts.unshift(p);
        ledger('post', name, meter);
      });
      track('live_post_generated', {post:p.id, agent:name, source:'实时'});
      if (state.dlg && state.dlg.name === name) { state.dlg.tab = 'posts'; state.dlg.idx = 0; }
      town.say(name, {kind:'post', text:p.text, src:'live', postId:p.id}, 8);
      if (state.panel === 'board') renderPanel();
    } catch (e) {
      const code = e && e.code;
      if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)) { aiOff = true; renderSimCtrls(); toast('没有获得调用 Claude 的许可，无法实时生成。'); }
      else if (code === 'rate_limited') toast('调用太频繁或额度用完了，过一会儿再试。');
      else if (['town_busy', 'quota_exceeded', 'unavailable'].includes(code)) saveFail(e);
      else if (code !== 'cancelled' && code !== 'gone') toast('这次没发出来，再点一次试试。');
    } finally { liveBusy = false; if (state.dlg) renderDlg(); }
  }

    if (state.dlg) renderDlg();

  // ---------------- real people: presence + chat ----------------
  let room = null, lastSentRole = null;
  function updateOnline(peers){
    const n = (peers || []).filter(p => p.kind === 'viewer').length;
    $('onlineCount').textContent = n <= 1 ? '只有你在线' : `${n} 人在线`;
  }
  function onChat(msg){
    const text = clip(str(msg.data && msg.data.text), 120);
    if (!text) return;
    const who = msg.isMe ? '你' : (msg.by ? personName(msg.by) : '访客');
    if (msg.by) resolveNames([msg.by]);
    const log = $('chatLog');
    log.append(el('li', null, el('b', null, who + '：'), text));
    while (log.children.length > 40) log.firstChild.remove();
    log.scrollTop = log.scrollHeight;
    town.chatBubble(msg, text);
  }
  roomReady.then(r => {
    if (!r) return;
    room = r; $('chat').hidden = false;
    const pos = town.myPos ? town.myPos() : {x:0, z:5, ry:0};
    room.presence({...pos, role:state.role, col:me.color}).catch(() => {});
    lastSentRole = state.role;
    room.onPeers(ch => { town.peersChange && town.peersChange(ch); updateOnline(ch.peers); }, () => {});
    room.on('chat', onChat, () => { $('chatSend').disabled = true; });
    room.onConnection(ok => { $('chatSend').disabled = !ok; }, () => {});
    $('chatLog').append(el('li', {class:'sys'}, '你进了小镇。在线的人会出现在地图上。'));
  });
  $('chatForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('chatInput').value.trim(); if (!v || !room) return;
    room.emit('chat', {text:clip(v, 120)}).then(() => { $('chatInput').value = ''; track('chat_sent'); })
      .catch(err => { toast(err && err.code === 'not_permitted' ? '你现在只有查看权限，不能在镇上说话。' : '没发出去，再试一次。'); });
  });
  $('chatToggle').addEventListener('click', () => {
    const open = $('chatBody').hidden; $('chatBody').hidden = !open; $('chatToggle').setAttribute('aria-expanded', String(open));
  });

      }
      p.role = pres.role; p.target = {x:clampNum(pres.x), z:clampNum(pres.z), ry:Number(pres.ry) || 0};
      peerLabel(p);
    }
    function removePeer(id){ const p = peerChars[id]; if (!p) return; scene.remove(p.g); p.tag.w.remove(); delete peerChars[id]; }
    town.peersChange = ch => { ch.joined.forEach(upsertPeer); ch.updated.forEach(upsertPeer); ch.left.forEach(pr => removePeer(pr.peer)); };
    town.chatBubble = (msg, text) => {
      const target = msg.sameTab ? player : peerChars[msg.peer]; if (!target) return;
      const bub = target.tag.bub; bub.className = 'bub'; bub.textContent = clip(text, 40); delete bub.dataset.post;
      bub.hidden = false; target.bubbleUntil = performance.now() / 1000 + 6;
    };
    town.myPos = () => ({x:+player.g.position.x.toFixed(2), z:+player.g.position.z.toFixed(2), ry:+player.g.rotation.y.toFixed(2)});

    // ---------- bridge for the simulation ----------
    const PLACES = {'广场':{x:0, z:4.5, r:3.2}, '农田':{x:-15, z:7.6, r:2.2}, '池塘边':{x:8.4, z:12.5, r:1.6}, '布告栏':{x:2.8, z:-2, r:1}, '村公所':{x:0, z:-13.6, r:2.6}};
    town.spot = (name, place) => {
      if (place === '家') { const h = homes[ag(name) ? ag(name).home : 0] || {x:0, z:4}; const p = {x:h.x + (Math.random() - .5) * 1.4, z:h.z + (Math.random() - .5) * .8}; pushOut(p); return p; }
      const b = PLACES[place] || PLACES['广场'];
      for (let i = 0; i < 20; i++) { const a = Math.random() * Math.PI * 2, r = Math.random() * b.r; const p = {x:b.x + Math.cos(a) * r, z:b.z + Math.sin(a) * r}; if (walkable(p.x, p.z, .6)) return p; }
      const p = {x:b.x, z:b.z}; pushOut(p); return p;
    };
    town.go = (name, p) => { const c = chars[name]; if (!c) return; c.goal = {x:p.x, z:p.z}; pushOut(c.goal); c.state = 'go'; c.faceTo = null; };
    town.arrive = (ns, timeout) => new Promise(res => { const t0 = performance.now(); const tick = () => { if (ns.every(n => !chars[n] || chars[n].state !== 'go') || performance.now() - t0 > timeout) res(); else setTimeout(tick, 200); }; tick(); });
    town.say = (name, b, secs) => {
      const c = chars[name]; if (!c) return;
      const bub = c.tag.bub; bub.textContent = '';
      bub.className = 'bub' + (b.kind === 'thought' ? ' thought' : b.kind === 'line' ? ' line' : b.kind === 'birth' ? ' birth' : '');
      if (b.kind === 'post') bub.append(srcTag(b.src || 'live'));
      else if (b.kind === 'plan') bub.append(el('span', {class:'k'}, '今天'));
      else if (b.kind === 'thought') bub.append(el('span', {class:'k'}, '在想'));
      else if (b.kind === 'birth') bub.append(el('span', {class:'k'}, '刚出生'));
      bub.append(clip(b.text, b.kind === 'line' ? 60 : 28));
      if (b.postId) bub.dataset.post = b.postId; else delete bub.dataset.post;
      bub.hidden = false; c.bubbleUntil = performance.now() / 1000 + (secs || 6);
    };
    town.play = async (a, b, lines) => {
      const A = chars[a], B = chars[b]; if (!A || !B) return;
      A.state = B.state = 'stay'; A.faceTo = B; B.faceTo = A;
      for (const l of lines) {
        const other = l.who === a ? B : A; other.tag.bub.hidden = true; other.bubbleUntil = 0;
        town.say(l.who, {kind:'line', text:l.text}, 6);
        await sleep(Math.min(5200, 1800 + Array.from(l.text).length * 70));
      }
      A.tag.bub.hidden = B.tag.bub.hidden = true; A.bubbleUntil = B.bubbleUntil = 0; A.faceTo = B.faceTo = null;
    };
    let camFocus = null;
    town.focus = p => { camFocus = p ? {x:p.x, z:p.z} : null; };
    town.tags = () => {
      Object.keys(chars).forEach(n => {
        if (!ag(n)) return;
        const nm = chars[n].tag.nm; nm.textContent = ''; const st = stageOf(n);
        nm.append(...[n, el('span', {class:'md'}, ` · ${ag(n).mood}`), st !== '成年' ? el('span', {class:'st'}, st) : null, ag(n).ownerId ? el('span', {class:'pl'}, ag(n).ownerId === me.id ? '我的' : '玩家') : null].filter(Boolean));
      });
      player.tag.nm.textContent = ''; player.tag.nm.append(el('i', {class:'rd', style:`background:${ROLE[state.role].color}`}), `你 · ${ROLE[state.role].label}`);
      if (lastSentRole !== state.role && room) { lastSentRole = state.role; room.presence({role:state.role}).catch(() => {}); }
    };
    town.release = () => { Object.values(chars).forEach(c => { c.state = 'idle'; c.timer = 1 + Math.random() * 3; c.faceTo = null; }); camFocus = null; };
    town.holdTalker = name => { const c = chars[name]; if (c) c.held = true; };
    town.releaseTalker = name => { const c = chars[name]; if (c) c.held = false; };
    const SKY = {
      day:{bg:'#9fd3e6', hemi:.78, sun:.85, sunC:'#ffe6bd', glow:0},
      morning:{bg:'#cfe4ea', hemi:.72, sun:.7, sunC:'#fff0d4', glow:0},
      noon:{bg:'#9fd3e6', hemi:.82, sun:.95, sunC:'#fff4dc', glow:0},
      afternoon:{bg:'#a6cfdc', hemi:.76, sun:.85, sunC:'#ffe2b0', glow:0},
      evening:{bg:'#eeb07e', hemi:.58, sun:.6, sunC:'#ffad6b', glow:.45},
      night:{bg:'#26375a', hemi:.32, sun:.16, sunC:'#9db0ff', glow:1}
    };
    let skyT = SKY.day; const cBg = new T.Color('#9fd3e6'), cSun = new T.Color('#ffe6bd'), tmpC = new T.Color(); let glow = 0;
    town.sky = k => { skyT = SKY[k] || SKY.day; };

    const ray = new T.Raycaster(), ndc = new T.Vector2();
    let down = null;
    canvas.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY}; });
    canvas.addEventListener('pointerup', e => {
      if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) { down = null; return; }
      down = null;
      const r = canvas.getBoundingClientRect();
      ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      for (const h of ray.intersectObjects(clickables, true)) {
        const o = h.object, kind = o.userData.kind;
        if (kind === 'agent') { openAgent(o.userData.name); return; }
        if (kind === 'board' || kind === 'hall') { setPanel(kind); return; }
        if (o === ground) { const p = {x:h.point.x, z:h.point.z}; pushOut(p); player.goal = p; marker.position.x = p.x; marker.position.z = p.z; marker.visible = true; camFocus = null; return; }
      }
    });
    const keys = {};
    addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) { keys[k] = true; e.preventDefault(); } });
    addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    let zoom = innerWidth < 600 ? 1.15 : 1;
    canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.max(.55, Math.min(1.7, zoom * (e.deltaY > 0 ? 1.08 : .93))); }, {passive:false});
    $('zin').onclick = () => zoom = Math.max(.55, zoom * .85);
    $('zout').onclick = () => zoom = Math.min(1.7, zoom * 1.15);
    let pixel = true;
    function resize(){
      const w = innerWidth, h = innerHeight;
      renderer.setPixelRatio(pixel ? Math.min(1, 520 / w) : Math.min(devicePixelRatio, 2));
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    $('btnPixel').onclick = () => { pixel = !pixel; $('btnPixel').setAttribute('aria-pressed', String(pixel)); canvas.classList.toggle('pixel', pixel); resize(); };
    addEventListener('resize', resize); resize();

    const camTarget = new T.Vector3(0, 0, 5); const camOff = new T.Vector3(0, 17, 15); const v3 = new T.Vector3();
    let nextThought = 4, last = performance.now() / 1000, lastPres = 0, lastPos = {x:0, z:5, ry:0};
    function turnTo(obj, tx, tz, k){ const ang = Math.atan2(tx - obj.position.x, tz - obj.position.z); let d = ang - obj.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); obj.rotation.y += d * Math.min(1, k); }
    function animLimbs(c, moving, dt){
      c.walkT += dt * (moving ? 9 : 0);
      const s = moving ? Math.sin(c.walkT) * .6 : 0;
      c.parts.legL.rotation.x += (s - c.parts.legL.rotation.x) * .3; c.parts.legR.rotation.x += (-s - c.parts.legR.rotation.x) * .3;
      c.parts.armL.rotation.x += (-s * .8 - c.parts.armL.rotation.x) * .3; c.parts.armR.rotation.x += (s * .8 - c.parts.armR.rotation.x) * .3;
      c.g.position.y = moving ? Math.abs(Math.sin(c.walkT)) * .06 : 0;
    }
    function stepToward(c, goal, speed, dt){
      const p = c.g.position, dx = goal.x - p.x, dz = goal.z - p.z, d = Math.hypot(dx, dz);
      if (d < .15) return true;
      const st = Math.min(d, speed * dt); const np = {x:p.x + dx / d * st, z:p.z + dz / d * st}; pushOut(np);
      p.x = np.x; p.z = np.z; turnTo(c.g, goal.x, goal.z, dt * 10);
      return false;
    }
    function project(x, y, z, tag){
      v3.set(x, y, z).project(camera);
      if (v3.z > 1 || Math.abs(v3.x) > 1.2 || Math.abs(v3.y) > 1.2) { tag.w.style.visibility = 'hidden'; return; }
      tag.w.style.visibility = 'visible';
      tag.w.style.transform = `translate(${((v3.x * .5 + .5) * innerWidth).toFixed(1)}px,${((-v3.y * .5 + .5) * innerHeight).toFixed(1)}px) translate(-50%,-100%)`;
    }
    town.sync();

    function frame(){
      const t = performance.now() / 1000; const dt = Math.min(.05, t - last); last = t;
      const kx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
      const kz = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
      let pm = false;
      if (kx || kz) {
        player.goal = null; marker.visible = false; camFocus = null;
        const l = Math.hypot(kx, kz); const p = player.g.position; const np = {x:p.x + kx / l * 4.2 * dt, z:p.z + kz / l * 4.2 * dt}; pushOut(np);
        turnTo(player.g, np.x + kx, np.z + kz, dt * 12); p.x = np.x; p.z = np.z; pm = true;
      } else if (player.goal) {
        if (stepToward(player, player.goal, 4.2, dt)) { player.goal = null; marker.visible = false; } else pm = true;
      }
      animLimbs(player, pm, dt);
      if (room && t - lastPres > .12) {
        const mp = town.myPos();
        if (Math.abs(mp.x - lastPos.x) + Math.abs(mp.z - lastPos.z) > .03 || Math.abs(mp.ry - lastPos.ry) > .05) { room.presence({...mp, col:me.color, role:state.role}).catch(() => {}); lastPos = mp; lastPres = t; }
      }
      if (player.bubbleUntil < t && !player.tag.bub.hidden) player.tag.bub.hidden = true;
      for (const id in peerChars) {
        const p = peerChars[id]; if (!p.target) continue;
        const dx = p.target.x - p.g.position.x, dz = p.target.z - p.g.position.z, d = Math.hypot(dx, dz);
        const moving = d > .05;
        if (d > 6) { p.g.position.x = p.target.x; p.g.position.z = p.target.z; }
        else if (moving) { const st = Math.min(d, 5 * dt); p.g.position.x += dx / d * st; p.g.position.z += dz / d * st; }
        let dr = p.target.ry - p.g.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); p.g.rotation.y += dr * Math.min(1, dt * 10);
        animLimbs(p, moving, dt);
        if (p.bubbleUntil < t && !p.tag.bub.hidden) p.tag.bub.hidden = true;
      }
      marker.scale.setScalar(1 + Math.sin(t * 6) * .12);

      for (const name in chars) {
        const c = chars[name]; let moving = false;
        if (c.held) turnTo(c.g, player.g.position.x, player.g.position.z, dt * 6);
        else if (c.state === 'idle') {
          c.timer -= dt;
          if (c.timer <= 0) {
            // little ones tend to wander near a parent
            const a = ag(name), parent = a && stageOf(name) === '幼年' && a.parents.find(p => chars[p]);
            if (parent) { const pp = chars[parent].g.position; c.goal = {x:pp.x + (Math.random() - .5) * 3, z:pp.z + (Math.random() - .5) * 3}; pushOut(c.goal); }
            else c.goal = randomSpot();
            c.state = 'walk'; c.timer = 18;
          }
        }
        else if (c.state === 'walk') { c.timer -= dt; if (stepToward(c, c.goal, c.speed, dt) || c.timer <= 0) { c.state = 'idle'; c.timer = 2 + Math.random() * 5; } else moving = true; }
        else if (c.state === 'go') { if (stepToward(c, c.goal, c.speed * 1.35, dt)) c.state = 'stay'; else moving = true; }
        else if (c.state === 'stay' && c.faceTo && chars[c.faceTo.name]) turnTo(c.g, c.faceTo.g.position.x, c.faceTo.g.position.z, dt * 8);
        animLimbs(c, moving, dt);
        if (Math.abs(c.scale - c.targetScale) > .001) { c.scale += (c.targetScale - c.scale) * Math.min(1, dt * 1.5); c.g.scale.setScalar(c.scale); }
        if (c.bubbleUntil < t && !c.tag.bub.hidden) c.tag.bub.hidden = true;
      }
      for (let i = effects.length - 1; i >= 0; i--) {
        const f = effects[i]; f.age += dt;
        f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt; f.vy -= 1.2 * dt;
        f.m.rotation.y += dt * 4; f.m.material.opacity = Math.max(0, 1 - f.age / f.life);
        if (f.age >= f.life) { scene.remove(f.m); effects.splice(i, 1); }
      }
      if (!simBusy && t > nextThought) {
        const pool = Object.values(chars).filter(c => c.bubbleUntil < t && !c.held && ag(c.name));
        if (pool.length) {
          const c = pick(pool);
          const mems = ag(c.name).memories;
          if (Math.random() < .65 && mems.length) town.say(c.name, {kind:'thought', text:mems[mems.length - 1 - Math.floor(Math.random() * Math.min(3, mems.length))].t}, 6);
          else { const ps = postsOf(c.name); if (ps.length) { const p = ps[Math.floor(Math.random() * Math.min(3, ps.length))]; town.say(c.name, {kind:'post', text:p.text, src:p.src, postId:p.id}, 6); } }
        }
        nextThought = t + 5 + Math.random() * 5;
      }
      crops.forEach((cg, i) => { cg.rotation.z = Math.sin(t * 1.6 + i * .7) * .07; });
      pondMat.color.setHSL(.55, .55, .58 + Math.sin(t * 1.3) * .025);
      wellWater.position.y = .78 + Math.sin(t * 2) * .015;
      const k = Math.min(1, dt * 1.2);
      cBg.lerp(tmpC.set(skyT.bg), k); scene.background.copy(cBg); scene.fog.color.copy(cBg);
      hemi.intensity += (skyT.hemi - hemi.intensity) * k; sun.intensity += (skyT.sun - sun.intensity) * k;
      cSun.lerp(tmpC.set(skyT.sunC), k); sun.color.copy(cSun);
      glow += (skyT.glow - glow) * k; windowMat.emissive.setRGB(glow, .75 * glow, .3 * glow);

      const pp = player.g.position;
      const fx = camFocus ? camFocus.x : pp.x, fz = camFocus ? camFocus.z : pp.z;
      camTarget.lerp(v3.set(fx, 0, fz), .06);
      camera.position.set(camTarget.x + camOff.x * zoom, camOff.y * zoom, camTarget.z + camOff.z * zoom);
      camera.lookAt(camTarget.x, 1, camTarget.z);
      sun.position.set(camTarget.x + 18, 32, camTarget.z + 12); sun.target.position.set(camTarget.x, 0, camTarget.z); sun.target.updateMatrixWorld();
      renderer.render(scene, camera);

      for (const name in chars) { const c = chars[name]; project(c.g.position.x, 2.05 * c.scale + .3, c.g.position.z, c.tag); }
      project(pp.x, 2.45, pp.z, player.tag);
      for (const id in peerChars) { const p = peerChars[id]; project(p.g.position.x, 2.45, p.g.position.z, p.tag); }
      placeTags.forEach(p => project(p.x, p.y, p.z, p.tag));
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // ---------------- boot ----------------
  setPop(); renderSimCtrls(); updateRole();
  Promise.race([dbReady, sleep(10000)]).then(async () => {
    loaded = true; ensureRels(); town.sync(); updateRole();
    await loadStats();
    track('town_open', {entry:'load'});
    world.day = dayNow(); setPhase(); town.sky(skyNow());
    if (!showBusy()) setStatus(dbRef ? idleLine() : '这个环境里没有共享存档，进展只在本页，刷新就会回到开镇。');
    resolveNames([...names().map(n => ag(n).ownerId), ...busyList().map(x => x.b.uid), ...Object.keys(world.ledger || {})]);
    refreshUI(); renderSimCtrls();
    // a new town day starts at the same moment for everyone; the sky follows your own clock
    setInterval(() => {
      const d = dayNow();
      if (d !== world.day) { world.day = d; refreshUI(); }
      setPhase(); renderSimCtrls();
      if (!simBusy) town.sky(skyNow());
    }, 60000);
  });
})();
</script>
